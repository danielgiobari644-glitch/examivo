<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Results — EXAMIVO</title>
  <meta name="description" content="Your EXAMIVO results — score, review and targeted next steps." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="manifest.json" />
  <script>try{var m=localStorage.getItem("examivo.theme")||"dark";if(m==="system")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=m;}catch(e){}</script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/results.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="results-body">

    <header class="results-topbar">
      <div class="container">
        <a class="brand" href="app.html" aria-label="EXAMIVO">
          <img src="assets/logo/logo.svg" alt="EXAMIVO" width="150" height="28" />
        </a>
        <span class="spacer"></span>
        <a class="btn btn-ghost btn-sm" href="history.html">History</a>
        <button class="theme-btn" data-theme-toggle aria-label="Change theme"></button>
      </div>
    </header>

    <main class="results-main" id="main" data-results-root>
      <div style="display:grid;gap:.8rem;margin-top:1rem" data-results-skeleton>
        <div class="skeleton" style="height:210px;border-radius:22px"></div>
        <div class="skeleton" style="height:120px;border-radius:16px"></div>
        <div class="skeleton" style="height:260px;border-radius:16px"></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/results.js"></script>
</body>
</html>
