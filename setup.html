<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>New Practice — EXAMIVO</title>
  <meta name="description" content="Set up your EXAMIVO practice — class, subject, examination and material." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="manifest.json" />
  <script>try{var m=localStorage.getItem("examivo.theme")||"dark";if(m==="system")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=m;}catch(e){}</script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/setup.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="setup-body">

    <header class="setup-topbar">
      <div class="container">
        <button class="setup-back" data-back hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6 6-6-6 6-6"/></svg>
          Back
        </button>
        <a class="brand" href="app.html" aria-label="EXAMIVO">
          <img src="assets/logo/logo.svg" alt="EXAMIVO" width="150" height="28" />
        </a>
        <button class="theme-btn" data-theme-toggle aria-label="Change theme"></button>
      </div>
      <div class="progress-rail" role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
        <div class="bar" style="width:25%"></div>
      </div>
    </header>

    <main class="setup-main" id="main">
      <div id="step-root" class="page-enter"><!-- steps render here --></div>
    </main>
  </div>

  <script type="module" src="js/setup.js"></script>
</body>
</html>
