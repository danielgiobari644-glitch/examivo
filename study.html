<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study My Mistakes - EXAMIVO</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/app.html" class="brand-link">
        <div class="brand-mark">
          <img src="/icon.svg" alt="EXAMIVO Logo" />
        </div>
        <span class="brand-text">EXAMIVO</span>
      </a>

      <ul class="nav-links">
        <li><a href="/app.html" class="nav-link">Dashboard</a></li>
        <li><a href="/setup.html" class="nav-link">New Practice</a></li>
        <li><a href="/history.html" class="nav-link">History</a></li>
      </ul>

      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>
        <a href="/app.html" class="btn btn-secondary btn-sm nav-btn-desktop">Done</a>
        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle Navigation Menu">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-wrapper" style="max-width:900px; margin:2.5rem auto; padding:0 1.5rem 5rem;">
    <!-- Header Banner -->
    <div class="card" style="margin-bottom:2.5rem; border-color:var(--border-highlight); background:linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(56, 189, 248, 0.08) 100%), var(--surface);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
        <span class="badge badge-cyan">REVISION INTELLIGENCE</span>
        <span class="badge badge-primary" id="studyMetaBadge">Subject Revision</span>
      </div>
      <h1 style="font-size:1.85rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:0.5rem;" id="studyTitle">
        Study My Mistakes
      </h1>
      <p style="color:var(--text-secondary); font-size:0.95rem; line-height:1.5;" id="studySummary">
        High-yield concept notes and worked examples synthesized directly from the questions you missed.
      </p>

      <div style="display:flex; justify-content:flex-end; margin-top:1.5rem;">
        <button class="btn btn-primary btn-lg" id="retestMeTopBtn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span>Retest Me Now</span>
        </button>
      </div>
    </div>

    <!-- Cards container -->
    <div id="studyCardsContainer" style="display:flex; flex-direction:column; gap:1.75rem; margin-bottom:3rem;"></div>

    <!-- Quick Recall Questions -->
    <div class="card" style="margin-bottom:3rem;" id="selfCheckCard">
      <h3 style="font-size:1.25rem; font-weight:700; margin-bottom:0.5rem;">Rapid Self-Check</h3>
      <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">Click each card to verify your mental model before the retest:</p>
      <div id="selfCheckList" style="display:flex; flex-direction:column; gap:1rem;"></div>
    </div>

    <!-- Bottom Retest CTA -->
    <div style="text-align:center; padding:2rem 0;">
      <button class="btn btn-primary btn-lg" id="retestMeBottomBtn" style="padding:1rem 2.5rem; font-size:1.15rem;">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
        <span>Ready? Retest Me Now</span>
      </button>
    </div>
  </main>

  <script type="module">
    import { AIService, showAILoading, updateAIStage, hideAILoading, showToast, escapeHTML } from '/app.js';

    let studyData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const stored = sessionStorage.getItem('examivo_study_notes');
      if (!stored) {
        window.location.href = '/app.html';
        return;
      }
      studyData = JSON.parse(stored);

      document.getElementById('studyTitle').textContent = studyData.title || 'Study My Mistakes';
      document.getElementById('studySummary').textContent = studyData.summary || 'Turn your mistakes into exam points.';
      document.getElementById('studyMetaBadge').textContent = `${studyData.subject || 'Exam'} • ${studyData.examType || 'Practice'}`;

      renderStudyCards();
      renderSelfCheck();

      document.getElementById('retestMeTopBtn').onclick = launchRetest;
      document.getElementById('retestMeBottomBtn').onclick = launchRetest;
    });

    function renderStudyCards() {
      const container = document.getElementById('studyCardsContainer');
      const cards = studyData.cards || [];

      if (!cards.length) {
        container.innerHTML = '<div class="card" style="text-align:center;">No revision cards available.</div>';
        return;
      }

      container.innerHTML = cards.map((c, idx) => `
        <div class="card" style="border-left: 4px solid var(--primary-light);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <div style="font-size:1.2rem; font-weight:700; color:var(--text-primary);">
              ${escapeHTML(c.topic || `Concept ${idx + 1}`)}
            </div>
            <span class="badge badge-primary">High-Yield</span>
          </div>

          <div style="font-size:0.95rem; color:var(--text-secondary); line-height:1.6; margin-bottom:1.25rem;">
            <strong style="color:var(--text-primary);">Core Concept:</strong> ${escapeHTML(c.coreConcept)}
          </div>

          ${c.keyFormulasOrRules && c.keyFormulasOrRules.length ? `
            <div style="background:var(--surface-elevated); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border); margin-bottom:1.25rem;">
              <div style="font-size:0.8rem; font-weight:700; color:var(--accent-cyan); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem;">
                Key Formulas / Rules
              </div>
              <ul style="padding-left:1.25rem; font-family:var(--font-mono); font-size:0.875rem; color:var(--text-primary); line-height:1.6;">
                ${c.keyFormulasOrRules.map(r => `<li>${escapeHTML(r)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}

          <div style="background:rgba(239, 68, 68, 0.08); border:1px solid var(--danger-border); padding:1rem; border-radius:var(--radius-md); margin-bottom:1.25rem;">
            <div style="font-size:0.8rem; font-weight:700; color:var(--danger); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.35rem;">
              ⚠ The Exam Trap
            </div>
            <div style="font-size:0.875rem; color:var(--text-primary); line-height:1.5;">
              ${escapeHTML(c.theExamTrap || 'Watch out for sign errors or misreading the question constraints.')}
            </div>
          </div>

          ${c.workedExample ? `
            <div style="background:var(--surface-elevated); padding:1.25rem; border-radius:var(--radius-md); border:1px solid var(--border); margin-bottom:1rem;">
              <div style="font-size:0.8rem; font-weight:700; color:var(--success); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.5rem;">
                Step-by-Step Worked Example
              </div>
              <div style="font-size:0.9rem; line-height:1.6; color:var(--text-secondary); white-space:pre-line;">
                ${escapeHTML(c.workedExample)}
              </div>
            </div>
          ` : ''}

          ${c.memoryTrigger ? `
            <div style="font-size:0.85rem; color:var(--primary-light); font-weight:600;">
              💡 Memory Trigger: ${escapeHTML(c.memoryTrigger)}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function renderSelfCheck() {
      const container = document.getElementById('selfCheckList');
      const questions = studyData.quickSelfCheckQuestions || [];
      if (!questions.length) {
        document.getElementById('selfCheckCard').style.display = 'none';
        return;
      }

      container.innerHTML = questions.map((q, idx) => `
        <div style="background:var(--surface-elevated); border:1px solid var(--border); border-radius:var(--radius-md); padding:1rem 1.25rem; cursor:pointer;" onclick="toggleAnswer(${idx})">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:600; font-size:0.95rem; color:var(--text-primary);">${escapeHTML(q.prompt)}</div>
            <span style="font-size:0.8rem; color:var(--accent-cyan);" id="toggleIndicator_${idx}">Show Answer</span>
          </div>
          <div id="selfAnswer_${idx}" class="hidden" style="margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid var(--border); font-size:0.875rem; color:var(--success); line-height:1.5;">
            ${escapeHTML(q.answer)}
          </div>
        </div>
      `).join('');
    }

    window.toggleAnswer = (idx) => {
      const ans = document.getElementById(`selfAnswer_${idx}`);
      const ind = document.getElementById(`toggleIndicator_${idx}`);
      if (ans) {
        const isHidden = ans.classList.toggle('hidden');
        ind.textContent = isHidden ? 'Show Answer' : 'Hide Answer';
      }
    };

    async function launchRetest() {
      const stages = [
        'Formulating retest practice',
        'Calibrating question distractors',
        'Validating exam standard'
      ];
      showAILoading('GENERATING RETEST EXAMINATION', stages);

      try {
        updateAIStage(0);
        await new Promise(r => setTimeout(r, 600));

        updateAIStage(1);
        const weakTopics = (studyData.cards || []).map(c => c.topic);
        const retestData = await AIService.generateWeakPractice({
          academicLevel: studyData.academicLevel || 'SS3',
          subject: studyData.subject || 'Mathematics',
          examType: studyData.examType || 'WAEC',
          weakAreas: weakTopics,
        });

        updateAIStage(2);
        await new Promise(r => setTimeout(r, 600));

        const examToRun = {
          ...retestData,
          id: 'retest_' + Date.now(),
          academicLevel: studyData.academicLevel || 'SS3',
          subject: studyData.subject || 'Mathematics',
          examType: studyData.examType || 'WAEC',
          examMode: 'practice',
          createdAt: new Date().toISOString()
        };

        sessionStorage.setItem('examivo_current_exam', JSON.stringify(examToRun));
        hideAILoading();
        window.location.href = '/exam.html';
      } catch (err) {
        hideAILoading();
        showToast(err.message || 'Error generating retest', 'error');
      }
    }
  </script>
</body>
</html>
