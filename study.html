<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Study — EXAMIVO</title>
  <meta name="description" content="Revision notes and practice built from your mistakes." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="manifest.json" />
  <script>try{var m=localStorage.getItem("examivo.theme")||"dark";if(m==="system")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=m;}catch(e){}</script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/results.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-body">
    <header class="app-header" id="app-header"></header>

    <main id="main">
      <div class="history-wrap" data-study-root>
        <div class="history-head">
          <div>
            <h1>Study</h1>
            <p>Pick a completed exam and turn its mistakes into revision.</p>
          </div>
        </div>
        <div data-sessions-list>
          <div class="skeleton" style="height:88px;border-radius:16px"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/study.js"></script>
</body>
</html>
