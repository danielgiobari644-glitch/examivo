<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Exam History — EXAMIVO</title>
  <meta name="description" content="Every EXAMIVO practice you've completed, with scores and improvement." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="manifest.json" />
  <script>try{var m=localStorage.getItem("examivo.theme")||"dark";if(m==="system")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=m;}catch(e){}</script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-body">
    <header class="app-header" id="app-header"></header>

    <main id="main">
      <div class="history-wrap">
        <div class="history-head">
          <div>
            <h1>Exam History</h1>
            <p>Every practice you've completed — scores, dates and details.</p>
          </div>
          <div class="history-filters">
            <select class="select" data-filter-subject aria-label="Filter by subject">
              <option value="">All subjects</option>
            </select>
            <a class="btn btn-primary btn-sm" href="setup.html">New Practice</a>
          </div>
        </div>
        <div class="history-list" data-history-list></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/history.js"></script>
</body>
</html>
