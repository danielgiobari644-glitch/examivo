<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam History - EXAMIVO</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a href="/app.html" class="brand-link">
        <div class="brand-mark">
          <img src="/icon.svg" alt="EXAMIVO Logo" />
        </div>
        <span class="brand-text">EXAMIVO</span>
      </a>

      <ul class="nav-links">
        <li><a href="/app.html" class="nav-link">Dashboard</a></li>
        <li><a href="/setup.html" class="nav-link">New Practice</a></li>
        <li><a href="/history.html" class="nav-link active">History</a></li>
      </ul>

      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>
        <button id="openAuthBtn" class="btn btn-secondary btn-sm nav-btn-desktop">Sign In</button>
        <a href="/setup.html" class="btn btn-primary btn-sm nav-btn-desktop">New Practice</a>
        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle Navigation Menu">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-wrapper app-page">
    <div class="app-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:1rem;">
        <div>
          <h1 style="font-size:1.85rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:0.25rem;">
            Examination History
          </h1>
          <p style="color:var(--text-secondary); font-size:0.95rem;">Review past scores, revisit questions, and track your syllabus mastery.</p>
        </div>
        <button class="btn btn-secondary btn-sm" id="clearHistoryBtn" style="color:var(--danger);">Clear History</button>
      </div>

      <div id="historyExamsList" class="recent-exams-list"></div>
    </div>
  </main>

  <script type="module">
    import { StorageManager, showToast, escapeHTML } from '/app.js';

    document.addEventListener('DOMContentLoaded', () => {
      loadHistory();
      document.getElementById('clearHistoryBtn').onclick = () => {
        if (confirm('Are you sure you want to clear your local exam history?')) {
          localStorage.removeItem('examivo_exams');
          localStorage.removeItem('examivo_weak_areas');
          showToast('History cleared', 'info');
          loadHistory();
        }
      };
    });

    function loadHistory() {
      const container = document.getElementById('historyExamsList');
      const exams = StorageManager.getExams();

      if (!exams.length) {
        container.innerHTML = `
          <div class="card empty-state" style="padding: 3.5rem 1.5rem;">
            <div class="empty-state-icon">
              <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
              </svg>
            </div>
            <h3 class="empty-state-title">No examinations recorded yet</h3>
            <p class="empty-state-desc">Generate your first practice test to start tracking scores and concept diagnostics.</p>
            <a href="/setup.html" class="btn btn-primary">Start New Practice</a>
          </div>
        `;
        return;
      }

      container.innerHTML = exams.map(exam => {
        const scoreClass = (exam.scorePercentage || 0) >= 70 ? 'high' : (exam.scorePercentage || 0) >= 50 ? 'medium' : 'low';
        const dateStr = exam.completedAt ? new Date(exam.completedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Recent';

        return `
          <div class="exam-item-card">
            <div>
              <div class="exam-meta-title">${escapeHTML(exam.examTitle || `${exam.subject} Practice`)}</div>
              <div class="exam-meta-tags">
                <span>${escapeHTML(exam.academicLevel || 'Class')}</span>
                <span>•</span>
                <span>${escapeHTML(exam.examType || 'Exam')}</span>
                <span>•</span>
                <span>${exam.questions ? exam.questions.length : 0} Questions</span>
                <span>•</span>
                <span>${dateStr}</span>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:1.25rem;">
              <div class="exam-score-badge">
                <div class="score-num ${scoreClass}">${exam.scorePercentage !== undefined ? `${exam.scorePercentage}%` : 'Incomplete'}</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">${exam.correctCount !== undefined ? `${exam.correctCount}/${exam.questions.length} correct` : ''}</div>
              </div>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-secondary btn-sm" onclick="viewResult('${escapeHTML(exam.id)}')">View Details</button>
                <button class="btn btn-primary btn-sm" onclick="retakeExam('${escapeHTML(exam.id)}')">Retake</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.viewResult = (examId) => {
      const exams = StorageManager.getExams();
      const exam = exams.find(e => e.id === examId);
      if (exam) {
        sessionStorage.setItem('examivo_result_exam', JSON.stringify(exam));
        window.location.href = '/results.html';
      }
    };

    window.retakeExam = (examId) => {
      const exams = StorageManager.getExams();
      const exam = exams.find(e => e.id === examId);
      if (exam) {
        sessionStorage.setItem('examivo_current_exam', JSON.stringify(exam));
        window.location.href = '/exam.html';
      }
    };
  </script>
</body>
</html>
