<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EXAMIVO intelligence core">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- soft glow -->
  <circle cx="28" cy="28" r="26" fill="url(#coreGlow)"/>
  <!-- orbit rings -->
  <g stroke="url(#ringGrad)" fill="none" stroke-linecap="round">
    <circle cx="28" cy="28" r="22" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="3 6"/>
    <circle cx="28" cy="28" r="16.5" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="10 5"/>
    <circle cx="28" cy="28" r="11" stroke-opacity="0.85" stroke-width="1.6"/>
  </g>
  <!-- orbiting nodes -->
  <circle cx="28" cy="6" r="2.6" fill="#5EEAD4"/>
  <circle cx="44.5" cy="28" r="2" fill="#5EEAD4" fill-opacity="0.85"/>
  <circle cx="15" cy="37.5" r="1.7" fill="#5EEAD4" fill-opacity="0.7"/>
  <!-- luminous core -->
  <circle cx="28" cy="28" r="5.2" fill="#0A0B10"/>
  <circle cx="28" cy="28" r="4" fill="#2DD4BF"/>
  <circle cx="26.7" cy="26.7" r="1.3" fill="#F0FDFA"/>
</svg>
