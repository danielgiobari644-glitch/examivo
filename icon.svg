<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#090d16" />
  <circle cx="256" cy="256" r="190" fill="url(#coreGlow)" opacity="0.65" />
  <ellipse cx="256" cy="256" rx="160" ry="70" fill="none" stroke="url(#ringGrad1)" stroke-width="3" stroke-dasharray="16 8 4 8" transform="rotate(-30 256 256)" opacity="0.85" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="160" ry="70" fill="none" stroke="url(#ringGrad2)" stroke-width="3" stroke-dasharray="24 12" transform="rotate(45 256 256)" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="6 6" />

  <circle cx="130" cy="180" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="380" cy="330" r="5" fill="#818cf8" filter="url(#glow)" />
  <circle cx="210" cy="360" r="4" fill="#c084fc" filter="url(#glow)" />
  <circle cx="330" cy="150" r="4.5" fill="#38bdf8" filter="url(#glow)" />

  <circle cx="256" cy="256" r="44" fill="#4f46e5" filter="url(#glow)" opacity="0.9" />
  <circle cx="256" cy="256" r="28" fill="#818cf8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  
  <line x1="256" y1="210" x2="256" y2="225" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="287" x2="256" y2="302" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="210" y1="256" x2="225" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="287" y1="256" x2="302" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
