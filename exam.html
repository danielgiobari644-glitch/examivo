<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Exam — EXAMIVO</title>
  <meta name="description" content="Sit your EXAMIVO practice exam." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="manifest.json" />
  <script>try{var m=localStorage.getItem("examivo.theme")||"dark";if(m==="system")m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=m;}catch(e){}</script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/exam.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="exam-body" id="exam-body" hidden>

    <header class="exam-header">
      <div class="container">
        <a class="brand" href="app.html" aria-label="EXAMIVO">
          <img src="assets/logo/logo.svg" alt="EXAMIVO" width="130" height="24" />
        </a>
        <div class="exam-meta" data-exam-meta></div>
        <span class="spacer"></span>
        <div class="exam-timer" data-timer hidden>
          <span class="et-label">TIME REMAINING</span>
          <span class="tabular" data-timer-value>--:--</span>
        </div>
        <button class="exam-quit" data-quit aria-label="Leave exam">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <div class="exam-layout">
      <main id="main">
        <article class="question-card" data-question-card><!-- question renders here --></article>
      </main>

      <aside class="exam-navpanel" data-navpanel aria-label="Question navigation">
        <button class="modal-close navpanel-close" data-navpanel-close aria-label="Close navigation" style="position:absolute;top:.7rem;right:.7rem">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <h3>Questions</h3>
        <div class="qnav-grid" data-qnav></div>
        <div class="qnav-legend">
          <span class="lg"><i class="ans" aria-hidden="true"></i> Answered</span>
          <span class="lg"><i aria-hidden="true"></i> Unanswered</span>
          <span class="lg"><i class="flg" aria-hidden="true"></i> Flagged</span>
          <span class="lg"><i class="cur" aria-hidden="true"></i> Current</span>
        </div>
      </aside>
    </div>

    <div class="navpanel-backdrop" data-navpanel-backdrop></div>

    <div class="exam-actions">
      <div class="container">
        <button class="btn btn-secondary mobilenav-toggle" data-navpanel-toggle>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <span data-nav-progress>0/0</span>
        </button>
        <button class="btn btn-secondary" data-prev>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6 6-6-6 6-6"/></svg>
          Previous
        </button>
        <button class="btn btn-secondary flag-btn" data-flag>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>
          Flag
        </button>
        <span class="spacer"></span>
        <span class="progress-text" data-progress-text></span>
        <button class="btn btn-secondary" data-next>
          Next
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
        <button class="btn btn-primary" data-submit>Submit</button>
      </div>
    </div>
  </div>

  <!-- AI generation happens here -->
  <div id="generation-root"></div>

  <script type="module" src="js/questions.js"></script>
  <script type="module" src="js/exams.js"></script>
</body>
</html>
